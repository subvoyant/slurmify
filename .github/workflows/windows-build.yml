# ──────────────────────────────────────────────────────────────────────
# .github/workflows/windows-build.yml
# ──────────────────────────────────────────────────────────────────────
#
# Builds the Slurmify Windows NSIS installer on a GitHub-hosted
# windows-latest runner and uploads it as a workflow artifact.
#
# The fastest way to get a Windows build into a tester's hands without
# owning or running a Windows machine yourself.  See
# docs/WINDOWS_BUILD.md for the full plan + decisions behind this file.
#
# Triggers
# ──────────
#   - Push a tag matching `v*-win` (e.g. `v0.2.1-win`).  Recommended
#     for "I want a build right now":
#         git tag v0.2.1-win
#         git push origin v0.2.1-win
#   - Manual dispatch from the Actions tab on github.com (Run workflow…).
#
# Output
# ──────────
#   A `slurmify-windows-installer` artifact attached to the workflow
#   run, containing the NSIS `-setup.exe`.  Click into the run on
#   github.com → scroll to the Artifacts section at the bottom → download.
#   Unzip locally, send the `.exe` to your tester.
#
# Cost
# ──────────
#   GitHub Actions counts Windows minutes at 2× the Linux rate.  A
#   typical 8-minute build is 16 minutes off your monthly free quota
#   (currently 2,000 min/month on the free plan).  Plenty for active
#   development; if you blow through it, switch to Path B (local
#   Windows machine) per docs/WINDOWS_BUILD.md.
#
# Notes
# ──────────
#   - MSI is intentionally NOT built — `--bundles nsis` skips it.
#     Tauri 2's MSI bundler crashes when `externalBin` is configured
#     (tauri-apps/tauri#14681).  NSIS produces a perfectly good
#     `-setup.exe` and is the recommended distribution format until
#     that issue is fixed upstream.
#   - The build is unsigned.  Bob (or any tester) will see Microsoft
#     SmartScreen on first launch and needs to click "More info" →
#     "Run anyway."  Adding Authenticode signing is a separate
#     workstream tracked under "What's deferred" in WINDOWS_BUILD.md.
# ──────────────────────────────────────────────────────────────────────

name: Build Windows installer

# Trigger:
#   - Any tag containing "-win" (e.g. v0.2.1-win, v0.2.1-win-2,
#     v0.2.2-win-rc1).  The pattern is `v*-win*` so suffixes after
#     -win work — the original `v*-win` was too strict and silently
#     swallowed retag attempts ending in -win-2.
#   - Manual dispatch from the Actions tab on github.com.  Builds
#     against whatever ref you pick (typically `main`).
on:
  push:
    tags:
      - "v*-win*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Toolchain ────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          # pnpm 11.x (installed via corepack-prepare-latest) uses
          # `node:sqlite` which was added to Node.js in v22.13.  Running
          # it on Node 20 produces ERR_UNKNOWN_BUILTIN_MODULE
          # (see v0.2.1-win build 25644504891 for the canonical
          # symptom).  Pin to 22; both 22 LTS and the latest pnpm are
          # pre-installed on `windows-latest` runners.
          node-version: "22"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install Rust (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # ── Runtime CLIs the sidecar bundles ─────────────────────────
      # ffmpeg.exe is needed by librosa's audioread fallback decoder
      # AND by api/upload.py for video → audio extraction.  rubberband.exe
      # is needed by pyrubberband for time-stretch + pitch-shift.  The
      # PyInstaller spec hard-fails the build if either is missing
      # (per ADR-0023's posture, applied identically on Windows).
      #
      # We install BOTH via direct downloads from upstream mirrors and
      # put them on PATH via $env:GITHUB_PATH.  Chocolatey is NOT used
      # for either — see the v0.2.1-win-3 incident:
      #
      #   `choco install -y ffmpeg` puts a SHIM at
      #   C:\ProgramData\Chocolatey\bin\ffmpeg.EXE (~70 KB) that
      #   delegates to the real binary buried under
      #   C:\ProgramData\Chocolatey\lib\ffmpeg\....  Our PyInstaller
      #   spec resolves ffmpeg via shutil.which("ffmpeg") and bundles
      #   whatever it finds — and what it found was the shim, not the
      #   ~150 MB real static binary.  At runtime on the tester's
      #   laptop the shim had no chocolatey lib dir to delegate to,
      #   so librosa's audioread fallback got empty output from
      #   "ffmpeg" and surfaced an empty NoBackendError on every m4a
      #   upload.  Direct downloads of self-contained binaries side-
      #   step the shim problem entirely.
      - name: Install ffmpeg (download from gyan.dev release mirror)
        shell: pwsh
        run: |
          $FfmpegVersion = "8.1.1"
          $Url = "https://github.com/GyanD/codexffmpeg/releases/download/$FfmpegVersion/ffmpeg-$FfmpegVersion-essentials_build.zip"
          $Zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          $Dir = "$env:RUNNER_TEMP\ffmpeg"

          Write-Host "[ci] Downloading $Url"
          Invoke-WebRequest -Uri $Url -OutFile $Zip -UseBasicParsing -ErrorAction Stop

          Write-Host "[ci] Expanding to $Dir"
          Expand-Archive -Path $Zip -DestinationPath $Dir -Force

          # The zip extracts to a versioned subdir like
          # ffmpeg-8.1.1-essentials_build\bin\ffmpeg.exe.  Find it and
          # put its directory on PATH for subsequent steps.
          $Exe = Get-ChildItem $Dir -Recurse -Filter "ffmpeg.exe" |
                 Select-Object -First 1
          if (-not $Exe) {
            Write-Error "[ci] ffmpeg.exe not found inside the downloaded zip. The gyan.dev archive layout may have changed."
            exit 1
          }
          # Sanity check: gyan.dev essentials ships a ~150 MB statically-
          # linked binary.  Anything sub-10 MB is almost certainly a
          # shim — fail loudly rather than bundle one into the sidecar.
          $SizeMb = [math]::Round($Exe.Length / 1MB, 2)
          Write-Host "[ci] Found ffmpeg.exe at $($Exe.FullName) ($SizeMb MB)"
          if ($Exe.Length -lt 10MB) {
            Write-Error "[ci] ffmpeg.exe is only $SizeMb MB - suspiciously small for a static build. Bailing rather than bundle a shim."
            exit 1
          }
          $BinDir = $Exe.Directory.FullName
          Write-Host "[ci] Adding $BinDir to GITHUB_PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $BinDir

      - name: Install rubberband (download from breakfastquay.com)
        shell: pwsh
        run: |
          # Pin a known-good version.  Bumping is a one-line change.
          $RubberbandVersion = "3.1.2"
          $Url = "https://breakfastquay.com/files/releases/rubberband-$RubberbandVersion-gpl-executable-windows.zip"
          $Zip = "$env:RUNNER_TEMP\rubberband.zip"
          $Dir = "$env:RUNNER_TEMP\rubberband"

          Write-Host "[ci] Downloading $Url"
          Invoke-WebRequest -Uri $Url -OutFile $Zip -UseBasicParsing -ErrorAction Stop

          Write-Host "[ci] Expanding to $Dir"
          Expand-Archive -Path $Zip -DestinationPath $Dir -Force

          # The zip extracts to a versioned subdir like
          # rubberband-3.1.2-gpl-executable-windows\.  Find the rubberband.exe
          # inside and add its directory to PATH for subsequent steps.
          $Exe = Get-ChildItem $Dir -Recurse -Filter "rubberband.exe" |
                 Select-Object -First 1
          if (-not $Exe) {
            Write-Error "[ci] rubberband.exe not found inside the downloaded zip — Breakfast Quay may have changed the archive layout. Check the URL or inspect $Dir."
            exit 1
          }
          $BinDir = $Exe.Directory.FullName
          Write-Host "[ci] Found rubberband.exe at $($Exe.FullName)"
          Write-Host "[ci] Adding $BinDir to GITHUB_PATH"
          Add-Content -Path $env:GITHUB_PATH -Value $BinDir

      - name: Verify ffmpeg + rubberband are on PATH
        shell: pwsh
        run: |
          Write-Host "ffmpeg:"
          ffmpeg -version | Select-Object -First 1
          Write-Host "rubberband:"
          rubberband --version

      # ── Backend Python deps ──────────────────────────────────────
      # Editable install with the dev extras gets us PyInstaller +
      # librosa + soundfile + pyrubberband + everything else the spec
      # references.
      - name: Install backend Python deps
        working-directory: src-python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ── Sidecar build ────────────────────────────────────────────
      # The PowerShell script handles the rust-target host triple
      # detection + binary placement so Tauri's externalBin resolver
      # finds the produced .exe at the path it expects.
      - name: Build Python sidecar (PyInstaller)
        # PYINSTALLER_NO_SMOKE skips the "start the bundle, kill it
        # after 4s" smoke test — CI containers sometimes can't bind
        # to a localhost port cleanly, and the smoke test is a nice-to-
        # have not a need-to-have.
        #
        # Invoke via `pwsh` (PowerShell 7), NOT `powershell` (Windows
        # PowerShell 5.1).  The script is UTF-8 without a BOM and
        # contains em-dashes and box-drawing characters in its
        # comments; Windows PowerShell 5.1 defaults to Windows-1252
        # for BOM-less files and mis-decodes those bytes into phantom
        # characters that break the parser ("string is missing the
        # terminator" cascading into bogus 'missing }' errors on every
        # if-block downstream).  pwsh defaults to UTF-8 and handles
        # the file correctly.  This was the root cause of the
        # v0.2.1-win-2 and -3 CI failures.
        env:
          PYINSTALLER_NO_SMOKE: "1"
        shell: pwsh
        run: pwsh -ExecutionPolicy Bypass -File scripts\build-sidecar.ps1

      # ── Frontend deps ────────────────────────────────────────────
      - name: Install frontend deps
        run: pnpm install

      # ── Tauri build ──────────────────────────────────────────────
      # `--bundles nsis` is required.  See top-of-file note re:
      # tauri#14681.
      - name: Build Tauri app + NSIS installer
        run: pnpm tauri build --bundles nsis

      # ── Upload installer as artifact ─────────────────────────────
      # The Artifacts section at the bottom of the workflow run page
      # gets a downloadable zip.  Inside: the `-setup.exe`.  Send to
      # the tester.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: slurmify-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 14
          if-no-files-found: error
