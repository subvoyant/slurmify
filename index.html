<!doctype html>
<html lang="en" data-skin="default">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIENA Slurmer</title>

    <!-- ── Audio-gear typography ──────────────────────────────────────
         • Major Mono Display — caps-only geometric mono.  Used for
           rack panel labels (the etched "SLICING" / "STRETCH" strip)
           and the SIENA SLURMER wordmark.  Reads like silk-screen on
           an aluminum panel.
         • VT323            — single-stroke pixel LCD font.  Used for
           value readouts (knob values, textbox numerics) so they
           feel like a real LCD glowing.
         • Share Tech Mono  — clean modern terminal mono.  Used for
           tooltip body + section dividers.
         • JetBrains Mono   — already used for some readouts; kept
           as a fallback for fine type.
         Three preconnects up front + one stylesheet link with the
         four families bundled.  display=swap so the page paints
         before the WebFont request resolves. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=VT323&family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
  </head>
  <body>
    <!--
      The data-skin attribute on <html> drives all skin-variant CSS rules
      (matches v0.1.6 ADR-0007 — same convention, same localStorage key
      "slurm_skin").  src/main.tsx restores the saved skin on boot.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
